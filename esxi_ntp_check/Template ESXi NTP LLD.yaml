zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: 67c7f1e1e2a74876882da91f248911d7
      name: Templates
  templates:
    - uuid: 5b780d3b3243408cbdf246a0cc3b5c6c
      template: 'Template ESXi NTP LLD'
      name: 'Template ESXi NTP LLD'
      description: |
        Мониторинг здоровья всех ESXi-хостов vCenter через LLD
        (NTP, VMkernel, Storage, DNS, Power).
        
        АРХИТЕКТУРА: шаблон привязывается НЕ к хостам ESXi, а к отдельному
        "мастер"-хосту Zabbix (по одному на каждый vCenter), например:
          Хост "vCenter 10.0.14.50" (группа vCenters, без интерфейсов)
            Макросы на нём: {$VMWARE.URL}, {$VMWARE.USERNAME}, {$VMWARE.PASSWORD}
        
        Discovery rule раз в час опрашивает vCenter и создаёт по каждому
        найденному ESXi-хосту 5 айтемов + 5 триггеров.
        Имена берутся из первоисточника (vCenter) — проблем матчинга нет.
        
        Макросы шаблона:
          {$ESXI.DNS.PREFERRED}, {$ESXI.DNS.ALTERNATE} — ожидаемые DNS-серверы
            (пусто = режим "наличие >=2 DNS"),
          {$ESXI.POWER.POLICY} — ожидаемая политика энергосбережения (High performance).
        
        Зависимости (на сервере/прокси Zabbix):
          - venv /opt/zabbix-venv с pyVmomi 8.0.3+/9.x
          - скрипт esxi_ntp_check.py в /usr/lib/zabbix/externalscripts/
            (версия с режимами discover/vmk/storage/dns/power; license отключён —
            у хостов под vCenter licenseManager отсутствует, чтение лицензий
            vCenter требует прав Global.Licenses, которых у мониторинговой учётки нет)
        Если несколько vCenter — создайте мастер-хост для каждого со своими макросами.
      groups:
        - name: Templates
      discovery_rules:
        - uuid: 4c06d8bacf924cd0be197565aacafdeb
          name: 'ESXi hosts discovery'
          type: EXTERNAL
          key: 'esxi_ntp_check.py["discover","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"]'
          delay: 1h
          lifetime: 30d
          description: |
            Обход всех HostSystem через vCenter SDK.
            Возвращает {#ESXINAME} (имя хоста в vCenter) и {#ESXIADDR} (IP mgmt).
          item_prototypes:
            - uuid: a17e16c3bab24ae6a771cce06b571d42
              name: 'DNS configured on {#ESXINAME}'
              type: EXTERNAL
              key: 'esxi_ntp_check.py["dns","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}"]'
              delay: 10m
              history: 7d
              description: |
                1 - в DNS-конфиге хоста есть оба заданных сервера
                ({$ESXI.DNS.PREFERRED}, {$ESXI.DNS.ALTERNATE}), либо при пустых
                макросах — настроено не менее 2 DNS-серверов, 0 - иначе.
              valuemap:
                name: 'DNS configured'
              trigger_prototypes:
                - uuid: 7fce0a473c414bb3884a783bba385910
                  expression: 'last(/Template ESXi NTP LLD/esxi_ntp_check.py["dns","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}"])=0'
                  name: 'DNS not configured on {#ESXINAME}'
                  event_name: 'DNS not configured on {#ESXINAME}'
                  priority: WARNING
                  description: 'На ESXi-хосте {#ESXINAME} DNS-серверы не настроены (нужно >=2 или заданные {$ESXI.DNS.PREFERRED}/{$ESXI.DNS.ALTERNATE}).'
            - uuid: a17e16c3bab24ae6a771cce06b571d44
              name: 'Power policy on {#ESXINAME}'
              type: EXTERNAL
              key: 'esxi_ntp_check.py["power","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.POWER.POLICY}"]'
              delay: 10m
              history: 7d
              description: |
                1 - активная политика энергосбережения = {$ESXI.POWER.POLICY},
                0 - иначе.
              valuemap:
                name: 'Power policy'
              trigger_prototypes:
                - uuid: 9de634ca574745cba9ed68b7cd733ec3
                  expression: 'last(/Template ESXi NTP LLD/esxi_ntp_check.py["power","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.POWER.POLICY}"])=0'
                  name: 'Power policy differs on {#ESXINAME}'
                  event_name: 'Power policy differs on {#ESXINAME}'
                  priority: WARNING
                  description: 'Активная политика энергосбережения на {#ESXINAME} не равна {$ESXI.POWER.POLICY}.'
            - uuid: a17e16c3bab24ae6a771cce06b571d41
              name: 'Storage adapters on {#ESXINAME}'
              type: EXTERNAL
              key: 'esxi_ntp_check.py["storage","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"]'
              delay: 10m
              history: 7d
              description: |
                1 - все известные Storage Adapters online (status=unknown,
                напр. встроенные контроллеры, не показываемые vCenter,
                проблемой не считаются),
                0 - есть адаптер в состоянии offline.
              valuemap:
                name: 'Storage adapters'
              trigger_prototypes:
                - uuid: 72e75925362649c992d3cac0900fce9f
                  expression: 'last(/Template ESXi NTP LLD/esxi_ntp_check.py["storage","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"])=0'
                  name: 'Storage adapter offline on {#ESXINAME}'
                  event_name: 'Storage adapter offline on {#ESXINAME}'
                  priority: HIGH
                  description: 'На ESXi-хосте {#ESXINAME} есть Storage Adapter не в состоянии online.'
            - uuid: a17e16c3bab24ae6a771cce06b571d40
              name: 'VMkernel adapters on {#ESXINAME}'
              type: EXTERNAL
              key: 'esxi_ntp_check.py["vmk","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"]'
              delay: 10m
              history: 7d
              description: |
                1 - настроен хотя бы один VMkernel adapter с IP (не 0.0.0.0),
                0 - иначе.
              valuemap:
                name: 'VMkernel adapters'
              trigger_prototypes:
                - uuid: 72e75925362649c992d3cac0900fce9e
                  expression: 'last(/Template ESXi NTP LLD/esxi_ntp_check.py["vmk","{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"])=0'
                  name: 'No VMkernel adapters on {#ESXINAME}'
                  event_name: 'No VMkernel adapters on {#ESXINAME}'
                  priority: WARNING
                  description: 'На ESXi-хосте {#ESXINAME} нет настроенных VMkernel-адаптеров с IP.'
            - uuid: a17e16c3bab24ae6a771cce06b571d4f
              name: 'NTP configured on {#ESXINAME}'
              type: EXTERNAL
              key: 'esxi_ntp_check.py["{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"]'
              delay: 10m
              history: 7d
              description: |
                1 - NTP настроен И служба ntpd Running (как в Time Configuration),
                0 - не настроен либо служба остановлена.
                Опрос через vCenter, кэш скрипта 10 мин (ESXI_NTP_TTL).
              valuemap:
                name: 'NTP configured'
              trigger_prototypes:
                - uuid: 72e75925362649c992d3cac0900fce9d
                  expression: 'last(/Template ESXi NTP LLD/esxi_ntp_check.py["{#ESXINAME}","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}"])=0'
                  name: 'NTP is not configured on {#ESXINAME}'
                  event_name: 'NTP is not configured on {#ESXINAME}'
                  priority: HIGH
                  description: 'На ESXi-хосте {#ESXINAME} NTP не работает (не настроен или служба ntpd не запущена).'
      macros:
        - macro: '{$ESXI.DNS.ALTERNATE}'
        - macro: '{$ESXI.DNS.PREFERRED}'
        - macro: '{$ESXI.POWER.POLICY}'
          value: 'High performance'
      valuemaps:
        - uuid: f3a1c0d0e2f34bb8b6b3a0c1d2e3f407
          name: 'DNS configured'
          mappings:
            - value: '0'
              newvalue: 'Not configured'
            - value: '1'
              newvalue: Configured
        - uuid: 1b901f1289dd4ee89f9136dfc5d30407
          name: 'NTP configured'
          mappings:
            - value: '0'
              newvalue: 'Not running'
            - value: '1'
              newvalue: Running
        - uuid: f3a1c0d0e2f34bb8b6b3a0c1d2e3f408
          name: 'Power policy'
          mappings:
            - value: '0'
              newvalue: 'Not High performance'
            - value: '1'
              newvalue: 'High performance'
        - uuid: f3a1c0d0e2f34bb8b6b3a0c1d2e3f406
          name: 'Storage adapters'
          mappings:
            - value: '0'
              newvalue: 'Not online'
            - value: '1'
              newvalue: Online
        - uuid: f3a1c0d0e2f34bb8b6b3a0c1d2e3f405
          name: 'VMkernel adapters'
          mappings:
            - value: '0'
              newvalue: 'Not configured'
            - value: '1'
              newvalue: Configured
