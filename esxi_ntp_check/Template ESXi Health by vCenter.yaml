        - uuid: 621f1afdd9e44879b9014c268df98ba6
          name: 'ESXi uplink NICs discovery'
          type: DEPENDENT
          key: 'esxi.pnic.discovery'
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ESXINAME}'
                value: '{$ESXI.LLD.FILTER.MATCHES}'
                formulaid: A
              - macro: '{#ESXINAME}'
                value: '{$ESXI.LLD.FILTER.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: 'Физические порты (vmnic), используемые как аплинки vSwitch/DVS: {#ESXINAME}, {#NIC}.'
          item_prototypes:
            - uuid: 63f6d8d5de4c4c5b81413b88fe1cadc0
              name: 'Alerting enabled for {#ESXINAME} (uplink {#NIC})'
              type: DEPENDENT
              key: 'esxi.alert.nic["{#ESXINAME}","{#NIC}"]'
              delay: '0'
              history: 7d
              description: 'Служебный флаг-подавитель: 1 - хост connected и не в Maintenance Mode, алерты включены; 0 - хост в Maintenance Mode или не connected, все триггеры хоста подавлены (и автоматически закрываются). После выхода из MM алерты возвращаются через {$ESXI.ALERT.HOLDDOWN}.'
              valuemap:
                name: 'Alerting'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.hosts["{#ESXINAME}"].alert'
              master_item:
                key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
              tags:
                - tag: component
                  value: 'maintenance'
                - tag: scope
                  value: 'esxi-health'
            - uuid: 54ad92a88e874821a909f40efcb45bfe
              name: 'Link state of {#NIC} on {#ESXINAME}'
              type: DEPENDENT
              key: 'esxi.pnic.up["{#ESXINAME}","{#NIC}"]'
              delay: '0'
              history: 7d
              description: '1 - линк up, 0 - down. Берутся только порты, являющиеся аплинками vSwitch/DVS (свободные порты игнорируются).'
              valuemap:
                name: 'Link state'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pnic["{#ESXINAME}"]["{#NIC}"].up'
              master_item:
                key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
              tags:
                - tag: component
                  value: 'network'
                - tag: scope
                  value: 'esxi-health'
              trigger_prototypes:
                - uuid: 998e92f04bab4ae8a9092994e5316780
                  expression: 'min(/Template ESXi Health by vCenter/esxi.alert.nic["{#ESXINAME}","{#NIC}"],{$ESXI.ALERT.HOLDDOWN})=1 and (max(/Template ESXi Health by vCenter/esxi.pnic.up["{#ESXINAME}","{#NIC}"],#2)=0)'
                  name: 'Uplink {#NIC} is down on {#ESXINAME}'
                  event_name: 'Uplink {#NIC} is down on {#ESXINAME} ({HOST.NAME})'
                  priority: WARNING
                  description: 'Физический порт {#NIC} (аплинк vSwitch/DVS) на {#ESXINAME} в состоянии down: избыточность потеряна.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: 'network'
                    - tag: scope
                      value: 'esxi-health'
                    - tag: esxi
                      value: '{#ESXINAME}'
            - uuid: f702aca3ec7045168f73888efe1d7bad
              name: 'Link speed of {#NIC} on {#ESXINAME}'
              type: DEPENDENT
              key: 'esxi.pnic.speed["{#ESXINAME}","{#NIC}"]'
              delay: '0'
              history: 7d
              units: 'Mbps'
              description: 'Скорость линка, Мбит/с (0 - линк down).'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.pnic["{#ESXINAME}"]["{#NIC}"].mb'
              master_item:
                key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
              tags:
                - tag: component
                  value: 'network'
                - tag: scope
                  value: 'esxi-health'
              trigger_prototypes:
                - uuid: 5f462166c9fe426d8040120dc1aff7ef
                  expression: 'min(/Template ESXi Health by vCenter/esxi.alert.nic["{#ESXINAME}","{#NIC}"],{$ESXI.ALERT.HOLDDOWN})=1 and (last(/Template ESXi Health by vCenter/esxi.pnic.speed["{#ESXINAME}","{#NIC}"])>0 and last(/Template ESXi Health by vCenter/esxi.pnic.speed["{#ESXINAME}","{#NIC}"])<{$ESXI.NIC.SPEED.MIN:"{#NIC}"})'
                  name: 'Uplink {#NIC} speed degraded on {#ESXINAME}'
                  event_name: 'Uplink {#NIC} speed degraded on {#ESXINAME} ({HOST.NAME})'
                  priority: WARNING
                  description: 'Скорость {#NIC} на {#ESXINAME} ниже {$ESXI.NIC.SPEED.MIN:"{#NIC}"} Мбит/с. Порог 0 = проверка выключена.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: 'network'
                    - tag: scope
                      value: 'esxi-health'
                    - tag: esxi
                      value: '{#ESXINAME}'
          master_item:
            key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.lld.pnic'
        - uuid: 357b5c76a8b447f78057e9b639a0acad
          name: 'ESXi vSwitch/DVS discovery'
          type: DEPENDENT
          key: 'esxi.sw.discovery'
          delay: '0'
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ESXINAME}'
                value: '{$ESXI.LLD.FILTER.MATCHES}'
                formulaid: A
              - macro: '{#ESXINAME}'
                value: '{$ESXI.LLD.FILTER.NOT_MATCHES}'
