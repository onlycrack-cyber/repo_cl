                  value: 'maintenance'
                - tag: scope
                  value: 'esxi-health'
            - uuid: b71480fc6d2f4287855f44fbac5aab3a
              name: 'Live uplinks of {#VSWITCH} on {#ESXINAME}'
              type: DEPENDENT
              key: 'esxi.sw.up["{#ESXINAME}","{#VSWITCH}"]'
              delay: '0'
              history: 7d
              description: 'Число аплинков vSwitch/DVS с поднятым линком.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.sw["{#ESXINAME}"]["{#VSWITCH}"].up'
              master_item:
                key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
              tags:
                - tag: component
                  value: 'network'
                - tag: scope
                  value: 'esxi-health'
              trigger_prototypes:
                - uuid: ac98ff1ad68e42ee81974a90a0f6bcc9
                  expression: 'min(/Template ESXi Health by vCenter/esxi.alert.sw["{#ESXINAME}","{#VSWITCH}"],{$ESXI.ALERT.HOLDDOWN})=1 and (max(/Template ESXi Health by vCenter/esxi.sw.up["{#ESXINAME}","{#VSWITCH}"],#2)=0 and last(/Template ESXi Health by vCenter/esxi.sw.total["{#ESXINAME}","{#VSWITCH}"])>0)'
                  name: 'No live uplinks on {#VSWITCH} ({#ESXINAME})'
                  event_name: 'No live uplinks on {#VSWITCH} ({#ESXINAME}) ({HOST.NAME})'
                  priority: HIGH
                  description: 'У {#VSWITCH} на {#ESXINAME} не осталось живых аплинков: сетевая изоляция.'
                  manual_close: 'YES'
                  tags:
                    - tag: component
                      value: 'network'
                    - tag: scope
                      value: 'esxi-health'
                    - tag: esxi
                      value: '{#ESXINAME}'
            - uuid: 9ca09ba092624d0fa28c09a6448ace15
              name: 'Configured uplinks of {#VSWITCH} on {#ESXINAME}'
              type: DEPENDENT
              key: 'esxi.sw.total["{#ESXINAME}","{#VSWITCH}"]'
              delay: '0'
              history: 7d
              description: 'Число аплинков, назначенных vSwitch/DVS.'
              preprocessing:
                - type: JSONPATH
                  parameters:
