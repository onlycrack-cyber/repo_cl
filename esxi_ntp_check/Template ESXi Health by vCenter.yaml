                formulaid: B
          description: 'Стандартные и распределённые свитчи хоста с аплинками: {#ESXINAME}, {#VSWITCH}.'
          item_prototypes:
            - uuid: 6a04403948854d0692999a8c253dcf88
              name: 'Alerting enabled for {#ESXINAME} (vSwitch {#VSWITCH})'
              type: DEPENDENT
