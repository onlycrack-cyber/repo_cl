                  value: 'network'
                - tag: scope
                  value: 'esxi-health'
          master_item:
            key: 'esxi_ntp_check.py["collect","{$VMWARE.URL}","{$VMWARE.USERNAME}","{$VMWARE.PASSWORD}","{$ESXI.DNS.PREFERRED}","{$ESXI.DNS.ALTERNATE}","{$ESXI.POWER.POLICY}"]'
          preprocessing:
            - type: JSONPATH
              parameters:
                - '$.lld.sw'
      macros:
        - macro: '{$ESXI.ALERT.HOLDDOWN}'
          value: '10m'
          description: 'Пауза после выхода хоста из Maintenance Mode / возврата в connected, прежде чем алерты снова включатся.'
        - macro: '{$ESXI.DNS.ALTERNATE}'
          description: 'Ожидаемый 2-й DNS (пусто + пустой PREFERRED = достаточно >=2 DNS).'
        - macro: '{$ESXI.DNS.PREFERRED}'
          description: 'Ожидаемый 1-й DNS.'
        - macro: '{$ESXI.LLD.FILTER.MATCHES}'
          value: '.*'
          description: 'Regexp: создавать айтемы только для ESXi с подходящим именем.'
        - macro: '{$ESXI.LLD.FILTER.NOT_MATCHES}'
          value: '^$'
          description: 'Regexp: исключить ESXi с подходящим именем (тестовые и т. п.).'
        - macro: '{$ESXI.NIC.SPEED.MIN}'
          value: '0'
          description: 'Минимальная скорость аплинка, Мбит/с; 0 = проверка выключена. Контекст: {$ESXI.NIC.SPEED.MIN:"vmnic0"}.'
        - macro: '{$ESXI.NTP.OFFSET.HIGH}'
          value: '5'
          description: 'Смещение времени ESXi относительно vCenter, сек: HIGH.'
        - macro: '{$ESXI.NTP.OFFSET.WARN}'
          value: '1'
          description: 'Смещение времени ESXi относительно vCenter, сек: WARNING.'
        - macro: '{$ESXI.POWER.POLICY}'
          value: 'High performance'
          description: 'Ожидаемая политика энергосбережения.'
