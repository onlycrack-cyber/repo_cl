              newvalue: 'Not online'
            - value: '1'
              newvalue: 'Online'
        - uuid: 4f412bbd2c4e4343a203b9efc11540f9
          name: 'VMkernel adapters'
          mappings:
            - value: '0'
              newvalue: 'Not configured'
            - value: '1'
              newvalue: 'Configured'
        - uuid: 6f3146a1cb9c4302805d7ae4bbb7e156
          name: 'Link state'
          mappings:
            - value: '0'
