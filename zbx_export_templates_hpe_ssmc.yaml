                  tags:
                    - tag: component
                      value: network
                    - tag: node
                      value: '{#NET_LABEL}'
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
            - uuid: ec7baed590a24873ac53edf81e4d373f
              name: '{#NET_LABEL} ({#NET_ADDR}): SSH port'
              type: DEPENDENT
              key: net.node.ssh[{#NET_ADDR}]
              delay: '0'
              history: 30d
              valuemap:
                name: HPE SSMC Availability
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.net[?(@.addr == '{#NET_ADDR}')].ssh.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
              tags:
                - tag: component
                  value: network
                - tag: node
                  value: '{#NET_LABEL}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
            - uuid: f2022011cbc642b18770eb7146dc41be
              name: '{#NET_LABEL} ({#NET_ADDR}): ICMP loss'
              type: DEPENDENT
              key: net.node.icmp.loss[{#NET_ADDR}]
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: '%'
              description: Not collected when the collector host has no ping binary.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.net[?(@.addr == '{#NET_ADDR}')].loss.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
              tags:
                - tag: component
                  value: network
                - tag: node
                  value: '{#NET_LABEL}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: 8911ad05311d4bd6b5f5593cfdc47b77
                  expression: min(/HPE SSMC StorageArray/net.node.icmp.loss[{#NET_ADDR}],5m)>{$SSMC_NET_LOSS_WARN}
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: max(/HPE SSMC StorageArray/net.node.icmp.loss[{#NET_ADDR}],5m)<{$SSMC_NET_LOSS_WARN}
                  name: '{#NET_LABEL} ({#NET_ADDR}): high ICMP packet loss (>{$SSMC_NET_LOSS_WARN}%)'
                  priority: WARNING
                  dependencies:
                    - name: '{#NET_LABEL} ({#NET_ADDR}) is unreachable'
                      expression: max(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#3)=0
                      recovery_expression: min(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#2)=1
                  tags:
                    - tag: component
                      value: network
                    - tag: node
                      value: '{#NET_LABEL}'
                    - tag: scope
                      value: performance
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
            - uuid: 7f8c457e4139434cb94904c35c652a70
              name: '{#NET_LABEL} ({#NET_ADDR}): ICMP response time'
              type: DEPENDENT
              key: net.node.icmp.rtt[{#NET_ADDR}]
              delay: '0'
              history: 30d
              value_type: FLOAT
              units: ms
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.net[?(@.addr == '{#NET_ADDR}')].rtt.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
              tags:
                - tag: component
                  value: network
                - tag: node
                  value: '{#NET_LABEL}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: 870e8747e41448b2a3b0d36be5ecb82d
                  expression: avg(/HPE SSMC StorageArray/net.node.icmp.rtt[{#NET_ADDR}],5m)>{$SSMC_NET_RTT_WARN}
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: avg(/HPE SSMC StorageArray/net.node.icmp.rtt[{#NET_ADDR}],5m)<{$SSMC_NET_RTT_WARN}*0.8
                  name: '{#NET_LABEL} ({#NET_ADDR}): high ICMP response time (>{$SSMC_NET_RTT_WARN}ms)'
                  priority: WARNING
                  dependencies:
                    - name: '{#NET_LABEL} ({#NET_ADDR}) is unreachable'
                      expression: max(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#3)=0
                      recovery_expression: min(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#2)=1
                  tags:
                    - tag: component
                      value: network
                    - tag: node
                      value: '{#NET_LABEL}'
                    - tag: scope
                      value: performance
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
          trigger_prototypes:
            - uuid: 768e1dbd4c0547e9b4a58434ad501dc9
              expression: max(/HPE SSMC StorageArray/net.node.ssh[{#NET_ADDR}],#3)=0 and last(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}])=1
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/HPE SSMC StorageArray/net.node.ssh[{#NET_ADDR}])=1
              name: '{#NET_LABEL} ({#NET_ADDR}): SSH port is not reachable'
              priority: WARNING
              description: The address answers but TCP/22 does not; the collector cannot log in.
              dependencies:
                - name: '{#NET_LABEL} ({#NET_ADDR}) is unreachable'
                  expression: max(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#3)=0
                  recovery_expression: min(/HPE SSMC StorageArray/net.node.up[{#NET_ADDR}],#2)=1
              tags:
                - tag: component
                  value: network
                - tag: node
                  value: '{#NET_LABEL}'
                - tag: scope
                  value: availability
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
          lld_macro_paths:
            - lld_macro: '{#NET_ADDR}'
              path: $.addr
            - lld_macro: '{#NET_LABEL}'
              path: $.label
            - lld_macro: '{#NET_ROLE}'
              path: $.role
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.net
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "net" missing in collector output
        - uuid: b00c138bfeab428fa05e0337e88655ee
          name: Node discovery
          type: DEPENDENT
          key: nodes.discovery
          delay: '0'
          description: 'Controller nodes. Macros: {#NODE_ID}, {#NODE_NAME}.'
          item_prototypes:
            - uuid: 5527e8ce54e6470890d5c4a1ef78ab5d
              name: Node [{#NODE_NAME}] model
              type: DEPENDENT
              key: node.model[{#NODE_ID}]
              delay: '0'
              history: 7d
              trends: '0'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.nodes[?(@.id == {#NODE_ID})].model.first()
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: node
                - tag: node
                  value: '{#NODE_NAME}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
            - uuid: e8d9093c7ffe40d6b1a9dc03a7fbb020
              name: Node [{#NODE_NAME}] status
              type: DEPENDENT
              key: node.status[{#NODE_ID}]
              delay: '0'
              history: 90d
              description: 1=OK, 2=Degraded, 4=Failed / not in cluster / missing, 5=Unknown
              valuemap:
                name: HPE SSMC Node State
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      var data = JSON.parse(value);
                      if (!data.nodes) {
                        throw 'nodes section missing';
                      }
                      for (var i = 0; i < data.nodes.length; i++) {
                        if (String(data.nodes[i].id) === '{#NODE_ID}') {
                          return data.nodes[i].status;
                        }
                      }
                      return 4;
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: node
                - tag: node
                  value: '{#NODE_NAME}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: a326f6478894468d9fe20139199d265c
                  expression: last(/HPE SSMC StorageArray/node.status[{#NODE_ID}])=4
                  name: Node [{#NODE_NAME}] has failed or left the cluster
                  priority: DISASTER
                  description: Controller node {#NODE_NAME} is Failed, not InCluster, or no longer listed by shownode. The array runs without redundancy.
                  tags:
                    - tag: component
                      value: node
                    - tag: node
                      value: '{#NODE_NAME}'
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                - uuid: 51ebd4dfd17c40708f88da81bfa354a0
                  expression: last(/HPE SSMC StorageArray/node.status[{#NODE_ID}])=2 or last(/HPE SSMC StorageArray/node.status[{#NODE_ID}])=5
                  name: Node [{#NODE_NAME}] is not OK (state {ITEM.LASTVALUE})
                  priority: HIGH
                  description: Controller node {#NODE_NAME} reports Degraded or an unknown state.
                  dependencies:
                    - name: Node [{#NODE_NAME}] has failed or left the cluster
                      expression: last(/HPE SSMC StorageArray/node.status[{#NODE_ID}])=4
                  tags:
                    - tag: component
                      value: node
                    - tag: node
                      value: '{#NODE_NAME}'
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          lld_macro_paths:
            - lld_macro: '{#NODE_ID}'
              path: $.id
            - lld_macro: '{#NODE_NAME}'
              path: $.name
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nodes
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "nodes" missing in collector output
        - uuid: f363616ed0ac4178be14103864a499bc
          name: Port discovery
          type: DEPENDENT
          key: ports.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#PORT_TYPE}'
                value: '{$SSMC_PORT_TYPE_NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          description: FC/iSCSI/SAS/RCIP ports. Ports whose type matches {$SSMC_PORT_TYPE_NOT_MATCHES} (unused "free" ports by default) are skipped.
          item_prototypes:
            - uuid: 892339a7ce7c42b0997699df07b300dd
              name: Port [{#PORT_POS}] link state
              type: DEPENDENT
              key: port.linkstate[{#PORT_POS}]
              delay: '0'
              history: 90d
              description: 0=UNKNOWN, 1=CONFIG_WAIT, 2=ALPA_WAIT, 3=LOGIN_WAIT, 4=READY, 5=LOSS_SYNC, 6=ERROR_STATE, 7=XXX, 8=NONPARTICIPATING, 9=INITIALIZING, 10=PENDING_RESET, 11=OFFLINE
              valuemap:
                name: HPE SSMC Port Link State
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.ports[?(@.pos == '{#PORT_POS}')].linkState.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: port
                - tag: port
                  value: '{#PORT_POS}'
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: 1a45de76652243438240a0a65b59f2fa
                  expression: min(/HPE SSMC StorageArray/port.linkstate[{#PORT_POS}],#2)<>4 and max(/HPE SSMC StorageArray/port.linkstate[{#PORT_POS}],#2)<>4
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/HPE SSMC StorageArray/port.linkstate[{#PORT_POS}])=4
                  name: Port [{#PORT_POS}] is not READY (state={ITEM.LASTVALUE})
                  priority: WARNING
                  description: Port {#PORT_POS} ({#PORT_TYPE}/{#PORT_PROTOCOL}) has not been READY for two polls in a row. Check FC/iSCSI connectivity.
                  tags:
                    - tag: component
                      value: port
                    - tag: port
                      value: '{#PORT_POS}'
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          lld_macro_paths:
            - lld_macro: '{#PORT_POS}'
              path: $.pos
            - lld_macro: '{#PORT_TYPE}'
              path: $.type
            - lld_macro: '{#PORT_MODE}'
              path: $.mode
            - lld_macro: '{#PORT_PROTOCOL}'
              path: $.protocol
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ports
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "ports" missing in collector output
        - uuid: 7a12ffb0991646eeb2e3435ae3f0855e
          name: Volume discovery
          type: DEPENDENT
          key: volumes.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#VOLUME_NAME}'
                value: '{$SSMC_VOLUME_NAME_MATCHES}'
                operator: MATCHES_REGEX
                formulaid: A
              - macro: '{#VOLUME_NAME}'
                value: '{$SSMC_VOLUME_NAME_NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: Virtual volumes (LUNs). Filter with {$SSMC_VOLUME_NAME_MATCHES} / {$SSMC_VOLUME_NAME_NOT_MATCHES}. Fully provisioned volumes (admin, .srdata, thick LUNs) always report 100% utilization, so the override skips their utilization triggers.
          item_prototypes:
            - uuid: 6b0c47bd618e403b9a8d046f651c4cd3
              name: Volume [{#VOLUME_NAME}] allocated size (TB)
              type: DEPENDENT
              key: volume.size[{#VOLUME_NAME}]
              delay: '0'
              history: 90d
              value_type: FLOAT
              units: ' TB'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.volumes[?(@.name == '{#VOLUME_NAME}')].sizeMiB.first()
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-6'
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: volume
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
                - tag: volume
                  value: '{#VOLUME_NAME}'
            - uuid: fa0e151531264404ad3dfe08789b9a14
              name: Volume [{#VOLUME_NAME}] state
              type: DEPENDENT
              key: volume.state[{#VOLUME_NAME}]
              delay: '0'
              history: 90d
              description: 1=Normal, 2=Degraded, 3=Starting/Stopping/Copy, 4=Failed, 5=Unknown
              valuemap:
                name: HPE SSMC System State
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.volumes[?(@.name == '{#VOLUME_NAME}')].state.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: volume
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
                - tag: volume
                  value: '{#VOLUME_NAME}'
              trigger_prototypes:
                - uuid: 1a95e5199a43487eb96b5777c62ad992
                  expression: last(/HPE SSMC StorageArray/volume.state[{#VOLUME_NAME}])>=2
                  name: Volume [{#VOLUME_NAME}] is not Normal
                  priority: HIGH
                  description: Volume {#VOLUME_NAME} state is Degraded or Failed.
                  tags:
                    - tag: component
                      value: volume
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                    - tag: volume
                      value: '{#VOLUME_NAME}'
            - uuid: e03f45efe7b643e0961d3ae727f418f1
              name: Volume [{#VOLUME_NAME}] used space (TB)
              type: DEPENDENT
              key: volume.used[{#VOLUME_NAME}]
              delay: '0'
              history: 90d
              value_type: FLOAT
              units: ' TB'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.volumes[?(@.name == '{#VOLUME_NAME}')].usedMiB.first()
                  error_handler: DISCARD_VALUE
                - type: MULTIPLIER
                  parameters:
                    - '1.0E-6'
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: volume
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
                - tag: volume
                  value: '{#VOLUME_NAME}'
            - uuid: 4eeb90455eb04979a199d160c432f8ed
              name: Volume [{#VOLUME_NAME}] utilization (%)
              type: DEPENDENT
              key: volume.util[{#VOLUME_NAME}]
              delay: '0'
              history: 90d
              value_type: FLOAT
              units: '%'
              description: Volume utilization percentage (user space used / virtual size), computed by the collector. Was a Calculated item; now dependent, same key.
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.volumes[?(@.name == '{#VOLUME_NAME}')].utilPct.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: component
                  value: volume
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
                - tag: volume
                  value: '{#VOLUME_NAME}'
              trigger_prototypes:
                - uuid: 94e438cb78d94d2f899f32db7bfcd927
                  expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])>{$VOLUME_UTIL_CRIT}
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])<{$VOLUME_UTIL_CRIT}-{$SSMC_UTIL_HYSTERESIS}
                  name: Volume [{#VOLUME_NAME}] utilization is critical (>{$VOLUME_UTIL_CRIT}%)
                  priority: HIGH
                  description: Volume {#VOLUME_NAME} is over {$VOLUME_UTIL_CRIT}% full. Resolves below {$VOLUME_UTIL_CRIT}-{$SSMC_UTIL_HYSTERESIS}% to avoid flapping.
                  tags:
                    - tag: component
                      value: volume
                    - tag: scope
                      value: capacity
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                    - tag: volume
                      value: '{#VOLUME_NAME}'
                - uuid: 233024a5894f4718b25e9b382bb76fa4
                  expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])>{$VOLUME_UTIL_WARN}
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])<{$VOLUME_UTIL_WARN}-{$SSMC_UTIL_HYSTERESIS}
                  name: Volume [{#VOLUME_NAME}] utilization is high (>{$VOLUME_UTIL_WARN}%)
                  priority: WARNING
                  description: Volume {#VOLUME_NAME} is over {$VOLUME_UTIL_WARN}% full.
                  dependencies:
                    - name: Volume [{#VOLUME_NAME}] utilization is critical (>{$VOLUME_UTIL_CRIT}%)
                      expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])>{$VOLUME_UTIL_CRIT}
                      recovery_expression: last(/HPE SSMC StorageArray/volume.util[{#VOLUME_NAME}])<{$VOLUME_UTIL_CRIT}-{$SSMC_UTIL_HYSTERESIS}
                  tags:
                    - tag: component
                      value: volume
                    - tag: scope
                      value: capacity
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                    - tag: volume
                      value: '{#VOLUME_NAME}'
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          lld_macro_paths:
            - lld_macro: '{#VOLUME_NAME}'
              path: $.name
            - lld_macro: '{#VOLUME_ID}'
              path: $.id
            - lld_macro: '{#VOLUME_TYPE}'
              path: $.type
            - lld_macro: '{#VOLUME_PROV}'
              path: $.provisioningType
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.volumes
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "volumes" missing in collector output
          overrides:
            - name: No utilization triggers for fully provisioned volumes
              step: '1'
              filter:
                conditions:
                  - macro: '{#VOLUME_PROV}'
                    value: '{$SSMC_VOLUME_PROV_NO_UTIL}'
                    formulaid: A
              operations:
                - operationobject: TRIGGER_PROTOTYPE
                  operator: LIKE
                  value: utilization
                  discover: NO_DISCOVER
      tags:
        - tag: class
          value: storage
        - tag: target
          value: hpe-3par
      macros:
        - macro: '{$DISK_CRIT_STATE}'
          value: '4'
          description: Disk state code that raises the Failed trigger (4=Failed).
        - macro: '{$DISK_WARN_STATE}'
          value: '2'
          description: Disk state code that raises the Degraded trigger (2=Degraded).
        - macro: '{$SSMC_ALERT_SEVERITY_MATCHES}'
          value: ^[456]$
          description: Alert severity codes to discover (4=Major, 5=Critical, 6=Fatal).
        - macro: '{$SSMC_CAPACITY_PUSED_CRIT}'
          value: '90'
          description: Array capacity used, % - critical threshold.
        - macro: '{$SSMC_CAPACITY_PUSED_WARN}'
          value: '80'
          description: Array capacity used, % - warning threshold.
        - macro: '{$SSMC_CERT_EXPIRY_CRIT}'
          value: '7'
          description: Days before certificate expiry for the High trigger.
        - macro: '{$SSMC_CERT_EXPIRY_WARN}'
          value: '30'
          description: Days before certificate expiry for the Warning trigger.
        - macro: '{$SSMC_CERT_SERVICE_MATCHES}'
          value: .*
          description: Certificates (by service) to discover.
        - macro: '{$SSMC_CERT_SERVICE_NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: Certificates (by service) to skip.
        - macro: '{$SSMC_COLLECT_INTERVAL}'
          value: 5m
          description: Update interval of the SSH master item.
        - macro: '{$SSMC_COLLECT_TIME_WARN}'
          value: '5'
          description: Seconds; warn when three polls in a row take longer.
        - macro: '{$SSMC_HOST}'
          value: ssmc.example.com
          description: 3PAR array management hostname or IP address.
        - macro: '{$SSMC_ITEM_TIMEOUT}'
          value: 30s
          description: Timeout of the SSH master item. Keep above the script --deadline (25s).
        - macro: '{$SSMC_NET_INTERVAL}'
          value: 1m
          description: Update interval of the network reachability master item.
        - macro: '{$SSMC_NET_LOSS_WARN}'
          value: '20'
          description: ICMP loss, % - warning threshold.
        - macro: '{$SSMC_NET_RTT_WARN}'
          value: '100'
          description: ICMP average response time, ms - warning threshold.
        - macro: '{$SSMC_NODATA_TIMEOUT}'
          value: 15m
          description: Raise "No data from the collector" after this period.
        - macro: '{$SSMC_NODE_ADDRS}'
          value: ''
          description: Node addresses to probe, e.g. "0=10.0.0.11,1=10.0.0.12". The management address is always probed.
        - macro: '{$SSMC_PORT_TYPE_NOT_MATCHES}'
          value: ^free$
          description: Port types to skip in port discovery.
        - macro: '{$SSMC_SERVICE}'
          value: storage
          description: Value of the "service" tag on every item and trigger.
        - macro: '{$SSMC_SSH_PASS}'
          type: SECRET_TEXT
          description: '3PAR SSH password (Secret text). Empty: taken from /etc/zabbix/ssmc_collect.conf.'
        - macro: '{$SSMC_SSH_USER}'
          value: 3paradm
          description: 3PAR SSH user. A read-only (browse) account is enough.
        - macro: '{$SSMC_TLS_ENDPOINTS}'
          value: '8080'
          description: Comma separated [host:]port list whose TLS certificate is checked (8080 = WSAPI). Empty disables.
        - macro: '{$SSMC_UTIL_HYSTERESIS}'
          value: '2'
          description: Percent points a utilization must drop below a threshold to recover.
        - macro: '{$SSMC_VOLUME_NAME_MATCHES}'
          value: .*
          description: Volumes to discover.
        - macro: '{$SSMC_VOLUME_NAME_NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: Volumes to skip.
        - macro: '{$SSMC_VOLUME_PROV_NO_UTIL}'
          value: ^full$
          description: Provisioning types (showvv Prov) that get no utilization triggers; thick volumes are always 100%.
        - macro: '{$VOLUME_UTIL_CRIT}'
          value: '90'
          description: Volume utilization % critical threshold.
        - macro: '{$VOLUME_UTIL_WARN}'
          value: '80'
          description: Volume utilization % warning threshold.
