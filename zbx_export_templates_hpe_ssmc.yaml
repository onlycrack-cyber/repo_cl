        - uuid: c97d5d49890f49b1894f81d697eb1c23
          name: Node network discovery
          type: DEPENDENT
          key: net.discovery
          delay: '0'
          description: 'The array management address plus every node address in {$SSMC_NODE_ADDRS} (format "0=10.0.0.11,1=10.0.0.12"). Probed from the collector host every {$SSMC_NET_INTERVAL}: ICMP (system ping) and TCP to the probe ports (22 by default).'
