            - lld_macro: '{#CERT_SERVICE}'
              path: $.service
            - lld_macro: '{#CERT_CN}'
              path: $.cn
            - lld_macro: '{#CERT_TYPE}'
              path: $.type
            - lld_macro: '{#CERT_SOURCE}'
              path: $.source
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.certificates
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "certificates" missing in collector output
