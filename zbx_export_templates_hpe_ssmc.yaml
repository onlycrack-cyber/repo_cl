  triggers:
    - uuid: db4095d50e8c4b7aa9a12b6955e9cb6f
      expression: min(/HPE SSMC StorageArray/collect.status,#2)>=2 and length(last(/HPE SSMC StorageArray/collect.error))>0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/HPE SSMC StorageArray/collect.status)<2
      name: 'Data collection failed: {ITEM.LASTVALUE2}'
      priority: HIGH
      description: 'Two polls in a row failed completely: SSH unreachable, authentication, host key, configuration, or the script did not return JSON (not installed, python error). Check 3PAR connectivity and credentials on the collector host.'
      tags:
        - tag: component
          value: collector
        - tag: scope
          value: availability
        - tag: service
          value: '{$SSMC_SERVICE}'
        - tag: target
          value: hpe-3par
    - uuid: 1c1c2a0c8c644f4f9da83f967752b077
      expression: min(/HPE SSMC StorageArray/collect.status,#2)=1 and max(/HPE SSMC StorageArray/collect.status,#2)=1 and length(last(/HPE SSMC StorageArray/collect.error))>0
      recovery_mode: RECOVERY_EXPRESSION
      recovery_expression: last(/HPE SSMC StorageArray/collect.status)=0
      name: 'Data collection is partial: {ITEM.LASTVALUE2}'
      priority: WARNING
      description: Some CLI commands or TLS probes failed or timed out twice in a row. The rest of the data is still collected.
      dependencies:
        - name: 'Data collection failed: {ITEM.LASTVALUE2}'
          expression: min(/HPE SSMC StorageArray/collect.status,#2)>=2 and length(last(/HPE SSMC StorageArray/collect.error))>0
          recovery_expression: last(/HPE SSMC StorageArray/collect.status)<2
      tags:
        - tag: component
          value: collector
        - tag: scope
          value: availability
        - tag: service
          value: '{$SSMC_SERVICE}'
        - tag: target
          value: hpe-3par
