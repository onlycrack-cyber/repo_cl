            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          lld_macro_paths:
