            - uuid: 211393ac0d9343d1951496fd2d55854b
              name: '{#NET_LABEL} ({#NET_ADDR}): reachable'
              type: DEPENDENT
              key: net.node.up[{#NET_ADDR}]
              delay: '0'
              history: 30d
              description: 1 if ICMP or any TCP probe port answered.
              valuemap:
                name: HPE SSMC Availability
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.net[?(@.addr == '{#NET_ADDR}')].up.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
              tags:
