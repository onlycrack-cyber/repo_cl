zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: cc5f5913cc044cbfbdf10691b5662592
      name: Templates/Storage
  templates:
    - uuid: bc2f1bab5df6414d82f5b4224ec40341
      template: HPE SSMC StorageArray
      name: HPE SSMC StorageArray
      description: |-
        Monitors HPE 3PAR / Primera storage arrays through the 3PAR CLI over SSH.

        Data comes from ssmc_collect.py, run by the Zabbix server (or proxy) as an External check: put the script into the ExternalScripts directory (python3 + paramiko). No agent is needed.
        Two master items (SSH poll every {$SSMC_COLLECT_INTERVAL}, network probes every {$SSMC_NET_INTERVAL}) feed all other items as dependent items.

        Required macros: {$SSMC_HOST}, {$SSMC_SSH_USER}, {$SSMC_SSH_PASS} (Secret text).
        Optional: {$SSMC_NODE_ADDRS}, {$SSMC_TLS_ENDPOINTS}.
      vendor:
        name: Custom
        version: 7.0-2.1.0
      groups:
        - name: Templates/Storage
      items:
        - uuid: f5a2c8c608b34c94bb6b0adb0adefc5e
          name: Active CRITICAL alerts
          type: DEPENDENT
          key: alerts.count.critical
          delay: '0'
          history: 30d
          description: Active alerts with severity Critical or Fatal. Each one also gets its own Disaster trigger through "Alert discovery".
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alert_summary.critical
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: alert
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 27536fdfe7f14249b65ea56c1e7001e0
          name: Active MAJOR alerts
          type: DEPENDENT
          key: alerts.count.major
          delay: '0'
          history: 30d
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alert_summary.major
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: alert
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 82848a0e5b11499d8f93176d2eb0b83c
          name: Active alerts
          type: DEPENDENT
          key: alerts.count.total
          delay: '0'
          history: 30d
          description: Alerts reported by showalert that are not Fixed.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alert_summary.total
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: alert
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 589551ea9847456fa78211a7b074beca
          name: Latest CRITICAL alert
          type: DEPENDENT
          key: alerts.critical.last
          delay: '0'
          history: 30d
          trends: '0'
          value_type: CHAR
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alert_summary.last_critical
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: alert
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 49235a6ee7614059820c6741cb9aa5dd
          name: Collection duration
          type: DEPENDENT
          key: collect.duration
          delay: '0'
          history: 7d
          value_type: FLOAT
          units: s
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.duration
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: collector
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
          triggers:
            - uuid: 5e4db4be3975419d924afe0fc2c53b35
              expression: min(/HPE SSMC StorageArray/collect.duration,#3)>{$SSMC_COLLECT_TIME_WARN}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: max(/HPE SSMC StorageArray/collect.duration,#3)<{$SSMC_COLLECT_TIME_WARN}
              name: Collector is slow (>{$SSMC_COLLECT_TIME_WARN}s)
              opdata: 'Duration: {ITEM.LASTVALUE1}'
              priority: WARNING
              description: Three polls in a row took longer than {$SSMC_COLLECT_TIME_WARN}s. The array CLI is slow or overloaded; consider raising the interval or lowering --parallel.
              tags:
                - tag: component
                  value: collector
                - tag: scope
                  value: performance
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
        - uuid: 6d375a22f5a34760bd93649eeecca52e
          name: Collection error
          type: DEPENDENT
          key: collect.error
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: 'Empty string means no error. "partial: ..." lists failed commands; "invalid collector output: ..." means Zabbix did not get JSON from the script; anything else means the whole poll failed.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |-
                  var data;
                  try {
                    data = JSON.parse(value);
                  } catch (e) {
                    return 'invalid collector output: ' + String(value).substring(0, 250);
                  }
                  return data.error ? String(data.error) : '';
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: collector
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 8e4bb8e01b844fd8a6ff29fb5f419a10
          name: Collection status
          type: DEPENDENT
          key: collect.status
          delay: '0'
          history: 7d
          description: 0=OK, 1=Partial, 2=Failed, 3=Configuration error, 4=Invalid output (the master item did not return collector JSON).
          valuemap:
            name: HPE SSMC Collector Status
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.status
              error_handler: CUSTOM_VALUE
              error_handler_params: '4'
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: collector
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: fb126d482d6f47de8b61a045c15a5f03
          name: Collect network reachability
          type: EXTERNAL
          key: ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"]
          delay: '{$SSMC_NET_INTERVAL}'
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: 15s
          description: Master item. ICMP + TCP probes of the array management address and of the node addresses in {$SSMC_NODE_ADDRS}. Does not log in to the array.
          tags:
            - tag: component
              value: collector
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
          triggers:
            - uuid: 2ce668553e0349bd956ae8d9dfeac48f
              expression: nodata(/HPE SSMC StorageArray/ssmc_collect.py["--host={$SSMC_HOST}","--section=net","--node-addrs={$SSMC_NODE_ADDRS}"],{$SSMC_NODATA_TIMEOUT})=1
              name: No network reachability data for {$SSMC_NODATA_TIMEOUT}
              priority: WARNING
              description: The net section of ssmc_collect.py has stopped reporting.
              tags:
                - tag: component
                  value: collector
                - tag: scope
                  value: availability
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
        - uuid: 07d7f0710c144d4a87753c64a9b72c3c
          name: Collect all data
          type: EXTERNAL
          key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          delay: '{$SSMC_COLLECT_INTERVAL}'
          history: 1h
          value_type: TEXT
          trends: '0'
          timeout: '{$SSMC_ITEM_TIMEOUT}'
          description: |-
            Master item. One SSH session per poll runs showsys, showport, showpd, showpd -i, showvv, showbattery, shownode, showalert and showcert in parallel and probes TLS certificates on {$SSMC_TLS_ENDPOINTS}.
            Replaces the six former per-section master items. Credentials come from {$SSMC_SSH_USER} / {$SSMC_SSH_PASS} (Secret text); if the macros are empty the script falls back to /etc/zabbix/ssmc_collect.conf.
          tags:
            - tag: component
              value: collector
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
          triggers:
            - uuid: 8375174e714544f4b86d0d2c83191e57
              expression: nodata(/HPE SSMC StorageArray/ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"],{$SSMC_NODATA_TIMEOUT})=1
              name: No data from the collector for {$SSMC_NODATA_TIMEOUT}
              priority: HIGH
              description: ssmc_collect.py has not returned data. Check that the script is in the Zabbix server (or proxy) ExternalScripts directory and executable, and that external pollers are running.
              tags:
                - tag: component
                  value: collector
                - tag: scope
                  value: availability
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
        - uuid: 8491fd4b0e724fb88bfa1e1193c440b7
          name: Allocated capacity (TB)
          type: DEPENDENT
          key: system.allocatedcapacity
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ' TB'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.allocatedCapacityMiB
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1.0E-6'
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: capacity
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: ff5991af68b341f29090f95c51c8ab12
          name: Capacity used, in %
          type: DEPENDENT
          key: system.capacity.pused
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: '%'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.usedPct
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: capacity
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
          triggers:
            - uuid: 36cfabf62fcd4bb48aefcb636b8889a7
              expression: last(/HPE SSMC StorageArray/system.capacity.pused)>{$SSMC_CAPACITY_PUSED_CRIT}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/HPE SSMC StorageArray/system.capacity.pused)<{$SSMC_CAPACITY_PUSED_CRIT}-{$SSMC_UTIL_HYSTERESIS}
              name: Array capacity usage is critical (>{$SSMC_CAPACITY_PUSED_CRIT}%)
              priority: HIGH
              tags:
                - tag: component
                  value: capacity
                - tag: scope
                  value: capacity
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
            - uuid: 3a081b05d3e542b49c8e81886acc2fcb
              expression: last(/HPE SSMC StorageArray/system.capacity.pused)>{$SSMC_CAPACITY_PUSED_WARN}
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: last(/HPE SSMC StorageArray/system.capacity.pused)<{$SSMC_CAPACITY_PUSED_WARN}-{$SSMC_UTIL_HYSTERESIS}
              name: Array capacity usage is high (>{$SSMC_CAPACITY_PUSED_WARN}%)
              priority: WARNING
              dependencies:
                - name: Array capacity usage is critical (>{$SSMC_CAPACITY_PUSED_CRIT}%)
                  expression: last(/HPE SSMC StorageArray/system.capacity.pused)>{$SSMC_CAPACITY_PUSED_CRIT}
                  recovery_expression: last(/HPE SSMC StorageArray/system.capacity.pused)<{$SSMC_CAPACITY_PUSED_CRIT}-{$SSMC_UTIL_HYSTERESIS}
              tags:
                - tag: component
                  value: capacity
                - tag: scope
                  value: capacity
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
        - uuid: 0881fae0cade45c09067abe9f0bf9616
          name: Total physical disks
          type: DEPENDENT
          key: system.diskcount
          delay: '0'
          history: 90d
          description: Total number of physical disks in the array.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.disks.length()
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: disk
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: ba7cb8535c8a44e487bc1926478e80e6
          name: Free capacity (TB)
          type: DEPENDENT
          key: system.freecapacity
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ' TB'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.freeCapacityMiB
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1.0E-6'
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: capacity
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: c3a684683cd04569bb5bd7d96b25ec88
          name: System model
          type: DEPENDENT
          key: system.model
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: MODEL
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.model
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: system
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 5cb0ed48d47b43668dc92a2dc45746b1
          name: System name
          type: DEPENDENT
          key: system.name
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: NAME
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.name
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: system
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 09c8f8d375034467b927c4a03e8889b1
          name: System serial number
          type: DEPENDENT
          key: system.serial
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          inventory_link: SERIALNO_A
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.serial
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: system
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 9568597cb97d443cbcb222578f4e0597
          name: System overall state
          type: DEPENDENT
          key: system.state
          delay: '0'
          history: 7d
          description: '1=Normal, 2=Degraded, 3=Failed, 5=Unknown. Computed by the collector: Failed if a node failed or is missing, Degraded if any node, disk, battery or volume is not normal.'
          valuemap:
            name: HPE SSMC System State
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.overallState
              error_handler: DISCARD_VALUE
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: system
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
          triggers:
            - uuid: 823cd91cdf6d45c39ac35c1b368b9e06
              expression: last(/HPE SSMC StorageArray/system.state)=3
              name: System state is Failed
              priority: DISASTER
              description: A controller node failed or is missing from the cluster.
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
            - uuid: e7ffb146252247108396c54fb1a38c66
              expression: last(/HPE SSMC StorageArray/system.state)=2
              name: System state is Degraded
              priority: WARNING
              description: Derived by the collector from node, disk, battery and volume states. See the "System state reasons" item for details.
              tags:
                - tag: component
                  value: system
                - tag: scope
                  value: availability
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              dependencies:
                - name: System state is Failed
                  expression: last(/HPE SSMC StorageArray/system.state)=3
        - uuid: 19dfa4a2177f432583f75c1492d3816b
          name: System state reasons
          type: DEPENDENT
          key: system.state.reasons
          delay: '0'
          history: 7d
          trends: '0'
          value_type: CHAR
          description: Why the collector considers the array degraded or failed.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.stateReasons
              error_handler: DISCARD_VALUE
            - type: JAVASCRIPT
              parameters:
                - 'var r = JSON.parse(value); return r.length ? r.join(''; '') : ''none'';'
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: system
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
        - uuid: 7d69791d30f04ec7afcb6e1fc9234044
          name: Total capacity (TB)
          type: DEPENDENT
          key: system.totalcapacity
          delay: '0'
          history: 90d
          value_type: FLOAT
          units: ' TB'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.system.totalCapacityMiB
              error_handler: DISCARD_VALUE
            - type: MULTIPLIER
              parameters:
                - '1.0E-6'
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          tags:
            - tag: component
              value: capacity
            - tag: service
              value: '{$SSMC_SERVICE}'
            - tag: target
              value: hpe-3par
      discovery_rules:
        - uuid: c4d5e6f7a8b94c0d9e1f2a3b4c5d6e7f
          name: Alert discovery
          type: DEPENDENT
          key: alerts.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#ALERT_SEVERITY}'
                value: '{$SSMC_ALERT_SEVERITY_MATCHES}'
                operator: MATCHES_REGEX
                formulaid: A
          lifetime: 1d
          description: |-
            One entity per active (not Fixed) array alert with severity >= Major by default.
            Severity codes: 1=Info, 2=Minor, 3=Degraded, 4=Major, 5=Critical, 6=Fatal.
            Alerts disappear from showalert when fixed; their items return severity 0, the triggers resolve and the entities are deleted after 1 day.
          item_prototypes:
            - uuid: a2b3c4d5e6f74a8b9c0d1e2f3a4b5c6d
              name: Alert [{#ALERT_ID}] message
              type: DEPENDENT
              key: alert.message[{#ALERT_ID}]
              delay: '0'
              history: 7d
              trends: '0'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.alerts[?(@.id == {#ALERT_ID})].message.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: alert
                  value: '{#ALERT_ID}'
                - tag: component
                  value: alert
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
            - uuid: f0a1b2c3d4e54f6a9b7c8d9e0f1a2b3c
              name: Alert [{#ALERT_ID}] severity
              type: DEPENDENT
              key: alert.severity[{#ALERT_ID}]
              delay: '0'
              history: 90d
              description: 0=Resolved, 1=Info, 2=Minor, 3=Degraded, 4=Major, 5=Critical, 6=Fatal
              valuemap:
                name: HPE SSMC Alert Severity
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |-
                      var data = JSON.parse(value);
                      if (!data.alerts) {
                        throw 'alerts section missing';
                      }
                      for (var i = 0; i < data.alerts.length; i++) {
                        if (String(data.alerts[i].id) === '{#ALERT_ID}') {
                          return data.alerts[i].severity_code;
                        }
                      }
                      return 0;
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: alert
                  value: '{#ALERT_ID}'
                - tag: component
                  value: alert
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: 9fd6b88c861749ebb82ceb6be13afc58
                  expression: last(/HPE SSMC StorageArray/alert.severity[{#ALERT_ID}])>=5
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/HPE SSMC StorageArray/alert.severity[{#ALERT_ID}])<5
                  name: 'CRITICAL alert [{#ALERT_ID}]: {#ALERT_MSG}'
                  priority: DISASTER
                  description: The array raised an alert with severity Critical or Fatal. One Zabbix problem per 3PAR alert; it resolves when the alert is fixed or removed.
                  manual_close: 'YES'
                  tags:
                    - tag: alert
                      value: '{#ALERT_ID}'
                    - tag: component
                      value: alert
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                - uuid: f2a3b4c5d6e74f8a9b0c1d2e3f4a5b6c
                  expression: last(/HPE SSMC StorageArray/alert.severity[{#ALERT_ID}])=4
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: last(/HPE SSMC StorageArray/alert.severity[{#ALERT_ID}])<>4
                  name: 'Major alert [{#ALERT_ID}]: {#ALERT_MSG}'
                  priority: HIGH
                  description: Major alert on the storage array. Resolves when the alert is fixed or removed on the array (showalert no longer lists it).
                  manual_close: 'YES'
                  tags:
                    - tag: alert
                      value: '{#ALERT_ID}'
                    - tag: component
                      value: alert
                    - tag: scope
                      value: availability
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
          master_item:
            key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alerts
              error_handler: CUSTOM_ERROR
              error_handler_params: Section "alerts" missing in collector output
            - type: JAVASCRIPT
              parameters:
                - |-
                  var alts = JSON.parse(value);
                  var lld = [];
                  for (var i = 0; i < alts.length; i++) {
                    var a = alts[i];
                    var msg = (a.message || '').replace(/[\r\n]+/g, ' ');
                    lld.push({
                      '{#ALERT_ID}': String(a.id),
                      '{#ALERT_MSG}': msg.length > 180 ? msg.substring(0, 177) + '...' : msg,
                      '{#ALERT_SEVERITY}': String(a.severity_code),
                      '{#ALERT_STATE}': a.state || ''
                    });
                  }
                  return JSON.stringify(lld);
