        - uuid: 011ab89ac6f647edb184a9178db14f6b
          name: Certificate discovery
          type: DEPENDENT
          key: certs.discovery
          delay: '0'
          filter:
            evaltype: AND
            conditions:
              - macro: '{#CERT_SERVICE}'
                value: '{$SSMC_CERT_SERVICE_MATCHES}'
                operator: MATCHES_REGEX
                formulaid: A
              - macro: '{#CERT_SERVICE}'
                value: '{$SSMC_CERT_SERVICE_NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
                formulaid: B
          description: |-
            Certificates reported by showcert (source "array") plus the certificates presented on the TLS endpoints in {$SSMC_TLS_ENDPOINTS} (source "tls").
            Macros: {#CERT_ID}, {#CERT_SERVICE}, {#CERT_CN}, {#CERT_TYPE}, {#CERT_SOURCE}.
          item_prototypes:
            - uuid: 7b1e503bedc84c36be6aa4ff713bdfca
              name: Certificate [{#CERT_SERVICE}] expires on
              type: DEPENDENT
              key: cert.expiry[{#CERT_ID}]
              delay: '0'
              history: 90d
              units: unixtime
              description: notAfter of "{#CERT_CN}" ({#CERT_TYPE}).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.certificates[?(@.id == '{#CERT_ID}')].notAfter.first()
                  error_handler: DISCARD_VALUE
              master_item:
                key: ssmc_collect.py["--host={$SSMC_HOST}","--user={$SSMC_SSH_USER}","--password={$SSMC_SSH_PASS}","--section=all","--tls-endpoints={$SSMC_TLS_ENDPOINTS}"]
              tags:
                - tag: certificate
                  value: '{#CERT_SERVICE}'
                - tag: component
                  value: certificate
                - tag: service
                  value: '{$SSMC_SERVICE}'
                - tag: target
                  value: hpe-3par
              trigger_prototypes:
                - uuid: f4b0115d60e640a29228c541d23e6f3f
                  expression: last(/HPE SSMC StorageArray/cert.expiry[{#CERT_ID}])<now()
                  name: Certificate [{#CERT_SERVICE}] has expired
                  priority: HIGH
                  description: Certificate "{#CERT_CN}" ({#CERT_TYPE}, source {#CERT_SOURCE}) used by {#CERT_SERVICE} is past its end date. Clients such as SSMC, WSAPI, syslog or LDAP may refuse to connect.
                  manual_close: 'YES'
                  tags:
                    - tag: certificate
                      value: '{#CERT_SERVICE}'
                    - tag: component
                      value: certificate
                    - tag: scope
                      value: security
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                - uuid: 27b75b02f70144e1ab754a7e6ce13e72
                  expression: (last(/HPE SSMC StorageArray/cert.expiry[{#CERT_ID}])-now())/86400<{$SSMC_CERT_EXPIRY_CRIT}
                  name: Certificate [{#CERT_SERVICE}] expires in less than {$SSMC_CERT_EXPIRY_CRIT} days
                  opdata: 'Expires: {ITEM.LASTVALUE1}'
                  priority: HIGH
                  description: Renew "{#CERT_CN}" for {#CERT_SERVICE} (createcert / importcert).
                  dependencies:
                    - name: Certificate [{#CERT_SERVICE}] has expired
                      expression: last(/HPE SSMC StorageArray/cert.expiry[{#CERT_ID}])<now()
                  tags:
                    - tag: certificate
                      value: '{#CERT_SERVICE}'
                    - tag: component
                      value: certificate
                    - tag: scope
                      value: security
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
                - uuid: 085418a6c74b400f9f9289968d03531c
                  expression: (last(/HPE SSMC StorageArray/cert.expiry[{#CERT_ID}])-now())/86400<{$SSMC_CERT_EXPIRY_WARN}
                  name: Certificate [{#CERT_SERVICE}] expires in less than {$SSMC_CERT_EXPIRY_WARN} days
                  opdata: 'Expires: {ITEM.LASTVALUE1}'
                  priority: WARNING
                  description: Plan renewal of "{#CERT_CN}" for {#CERT_SERVICE}.
                  dependencies:
                    - name: Certificate [{#CERT_SERVICE}] expires in less than {$SSMC_CERT_EXPIRY_CRIT} days
                      expression: (last(/HPE SSMC StorageArray/cert.expiry[{#CERT_ID}])-now())/86400<{$SSMC_CERT_EXPIRY_CRIT}
                  tags:
                    - tag: certificate
                      value: '{#CERT_SERVICE}'
                    - tag: component
                      value: certificate
                    - tag: scope
                      value: security
                    - tag: service
                      value: '{$SSMC_SERVICE}'
                    - tag: target
                      value: hpe-3par
            - uuid: 1d9a46942a964193b317a156e45a1927
              name: Certificate [{#CERT_SERVICE}] days left
              type: DEPENDENT
              key: cert.days_left[{#CERT_ID}]
              delay: '0'
              history: 90d
              value_type: FLOAT
