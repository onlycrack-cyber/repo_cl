name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install paramiko pyyaml cryptography pyflakes
      - run: python -m pyflakes ssmc_collect.py tests deploy vmware/tools grafana/tools
      - run: python ssmc_collect.py --test > /dev/null
      - run: python -m unittest discover -s tests -v

  # Custom Problem Reports (Zabbix module): syntax on the oldest PHP of Zabbix 7.0, unit tests on supported PHP.
  custom-reports-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
      - run: find modules/custom_reports -name '*.php' -not -path '*/tests/*' -print0 | xargs -0 -n1 php -l > /dev/null

  custom-reports-tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.3']
    defaults:
      run:
        working-directory: modules/custom_reports
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, curl
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
