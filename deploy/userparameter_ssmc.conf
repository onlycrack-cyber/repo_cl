# Zabbix agent / agent 2 UserParameter for the "HPE SSMC StorageArray" template.
# Install to /etc/zabbix/zabbix_agentd.d/ (agent) or /etc/zabbix/zabbix_agent2.d/ (agent 2)
# and restart the agent.
#
#   $1 = {$SSMC_HOST}          array management address
#   $2 = section               all | net | system,disks,...
#   $3 = {$SSMC_NODE_ADDRS}    node addresses for the net section
#   $4 = {$SSMC_TLS_ENDPOINTS} [host:]port list for certificate checks
#
# Credentials are read by the script from /etc/zabbix/ssmc_collect.conf and are
# never part of the item key. Per-item timeouts come from the template
# ({$SSMC_ITEM_TIMEOUT}, Zabbix 7.0+ agents).
#
# The array host in Zabbix is monitored through this agent's active checks, so add
# its host name to the agent's Hostname list, e.g.:
#   Hostname=collector01,3par-st01,3par-st02
UserParameter=ssmc.collect[*],/usr/lib/zabbix/ssmc/ssmc_collect.py --host "$1" --section "$2" --node-addrs "$3" --tls-endpoints "$4"
